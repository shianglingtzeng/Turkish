<!DOCTYPE html>

<head>

<title>

</title>

<body>


<header>

<h1>
🇹🇷 Turkish Survival System

<p>
伊斯坦堡生活土耳其語助手

</header>



<main>


<section class="card">

<h2>
👋 今日任務

</div>


</section>





<section class="card">

載入課程...

</div>


</section>





<section class="card">


<h2>
🔎 搜尋土耳其語

</h2>


<input

id="searchInput"

placeholder="輸入中文或土耳其文"

>


<button onclick="searchWord()">

搜尋

</button>



<div id="searchResult">

</div>


</section>






<section class="card">


<h2>

</h2>


<div id="wordArea">

</div>



</section>






<section class="card">


<h2>
⭐ 我的學習

</h2>


<div id="progressArea">

</div>


</section>





<section class="card">


<h2>
🗣 語音測試

</h2>


<button onclick="speakTest()">

播放今日土耳其語

</button>

</main>



<footer>

Turkish Survival System v2.0

<br>

Made for Istanbul Life 🇹🇷
