<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
🇹🇷 Turkish Survival System
</title>


<link rel="stylesheet" href="style.css">


<link rel="manifest" href="pwa/manifest.json">


<meta name="theme-color" content="#c8102e">


</head>


<body>


<header>

<h1>
🇹🇷 Turkish Survival System
</h1>

<p>
Istanbul Life Assistant
</p>


<p>
30 Days A1 Survival Course
</p>


</header>



<main>



<!-- 今日任務 -->

<section class="card">


<h2>
📅 今日任務
</h2>


<div id="dailyMission">

載入今日任務...

</div>


<button onclick="dailyCheckIn()">

✅ 完成今日學習

</button>


</section>





<!-- 學習進度 -->

<section class="card">


<h2>
⭐ 我的學習進度
</h2>


<div id="dashboard">

</div>


</section>







<!-- 30天課程 -->

<section class="card">


<h2>
📚 Day 1 - Day 30 A1課程
</h2>


<div id="dayMenu">


<button onclick="loadDays()">

開啟課程

</button>


</div>



<div id="lessonArea">


</div>



</section>







<!-- 搜尋 -->

<section class="card">


<h2>
🔎 土耳其生活搜尋
</h2>



<input

id="searchInput"

placeholder="
輸入中文或土耳其文，例如：
牛奶 / Süt / 價格
"

>


<button onclick="searchWord()">

搜尋

</button>



<div id="searchResult">


</div>



</section>







<!-- AI老師 -->


<section class="card">


<h2>
🤖 AI土耳其老師
</h2>


<textarea

id="aiInput"

placeholder="

例如：

我要買水

這多少錢？

怎麼去地鐵？

"

></textarea>



<button onclick="askTeacher()">

詢問老師

</button>



<div id="aiAnswer">


</div>



</section>







<!-- 相機商品 -->

<section class="card">


<h2>
📷 超市商品助手
</h2>



<input

id="cameraText"

placeholder="

輸入包裝上的土文

例如：

Son Kullanma Tarihi

"

>



<button onclick="scanTurkish()">

辨識

</button>



<div id="scanResult">

</div>



</section>








<!-- AI角色 -->

<section class="card">


<h2>
🗣 AI角色情境練習
</h2>



<div>


<button onclick="selectRole('超市店員')">

🛒 超市

</button>


<button onclick="selectRole('咖啡店員')">

☕

</button>


<button onclick="selectRole('房東')">

🏠

</button>


<button onclick="selectRole('Metro工作人員')">

🚇

</button>


</div>





<div id="chatBox">

請選擇角色開始練習

</div>





<input

id="userMessage"

placeholder="
輸入你的回答

"



>


<button onclick="sendMessage()">

送出

</button>




</section>









<!-- 發音 -->


<section class="card">


<h2>
🔊 發音練習
</h2>


<div id="speechPractice">


</div>



<button onclick="practiceSpeaking('Merhaba')">

練習 Merhaba

</button>


</section>









<!-- A1測驗 -->


<section class="card">


<h2>
📝 A1模擬測驗
</h2>



<div id="testArea">

</div>



<button onclick="startA1Test()">

開始測驗

</button>



</section>







<!-- Istanbul -->

<section class="card">


<h2>
📍 Istanbul生活模式
</h2>



<button onclick="showIstanbul()">

開啟我的生活圈

</button>



<div id="istanbulResult">

</div>



</section>







</main>








<footer>


<p>

Turkish Survival System v6.0

</p>


<p>

Made for Istanbul Life 🇹🇷

</p>


</footer>









<!-- DATABASE -->

<script src="js/turkish_database.js"></script>


<script src="js/istanbul_database.js"></script>


<script src="js/product_database.js"></script>


<script src="js/dialogue_database.js"></script>


<script src="js/a1_course.js"></script>


<script src="js/a1_30days.js"></script>


<script src="js/ai_roleplay.js"></script>







<!-- FUNCTION -->


<script src="js/app.js"></script>


<script src="js/progress.js"></script>


<script src="js/review.js"></script>


<script src="js/search.js"></script>


<script src="js/camera.js"></script>


<script src="js/ai_teacher.js"></script>


<script src="js/life_ai.js"></script>


<script src="js/dialogue.js"></script>


<script src="js/conversation_engine.js"></script>


<script src="js/speaking.js"></script>


<script src="js/pronunciation_teacher.js"></script>


<script src="js/a1_test.js"></script>


<script src="js/istanbul_life.js"></script>




<script>


// PWA啟動


if(
"serviceWorker" in navigator
){


navigator.serviceWorker.register(

"pwa/service-worker.js"

);


}



</script>




</body>


</html>
