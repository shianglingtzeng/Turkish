<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Turkish Survival System 🇹🇷
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>
🇹🇷 Turkish Survival System
</h1>

<p>
伊斯坦堡生活土耳其語助手
</p>

</header>



<main>


<section class="card">

<h2>
📊 我的學習進度
</h2>


<div id="dashboard">

</div>


<button onclick="dailyCheckIn()">

今日打卡

</button>


</section>
<section class="card">

<h2>
📷 看懂土耳其商品
</h2>


<p>
拍照或輸入看到的土文
</p>


<input
id="cameraText"
placeholder="例如 Son Kullanma Tarihi"
>


<button onclick="scanTurkish()">

辨識

</button>


<div id="scanResult">

</div>

</section>




<section class="card">

<h2>
🗺 Istanbul生活模式
</h2>


<button onclick="showIstanbul()">

開啟我的生活圈

</button>


<div id="istanbulResult">

</div>


</section>





<section class="card">

<h2>
🗣 情境對話

</h2>


<div id="dialogueArea">

</div>


<button onclick="nextDialogue()">

下一句

</button>


</section>




<section class="card">


<h2>
📅 30天生存課程
</h2>


<div id="dayMenu">

載入課程...

</div>


</section>





<section class="card">


<h2>
🔎 搜尋土耳其語

</h2>


<input

id="searchInput"

placeholder="輸入中文或土耳其文"

>


<button onclick="searchWord()">

搜尋

</button>



<div id="searchResult">

</div>


</section>






<section class="card">


<h2>
📖 今日單字
</h2>


<div id="wordArea">

請選擇課程

</div>



</section>






<section class="card">


<h2>
⭐ 我的學習

</h2>


<div id="progressArea">

</div>


</section>





<section class="card">


<h2>
🗣 語音測試

</h2>


<button onclick="speakTest()">

播放今日土耳其語

</button>


</section>



</main>



<footer>

Turkish Survival System v2.0

<br>

Made for Istanbul Life 🇹🇷

</footer>



<script src="turkish_database.js"></script>

<script src="app.js"></script>

<script src="istanbul_database.js"></script>

<script src="camera.js"></script>

<script src="istanbul_mode.js"></script>

<script src="dialogue_database.js"></script>

<script src="dialogue.js"></script>
</body>

</html>
