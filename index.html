<!DOCTYPE html>

<html lang="zh-TW">

<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Turkish Survival System 🇹🇷
</title>


<link rel="stylesheet" href="style.css">


<link rel="manifest" href="pwa/manifest.json">


</head>



<body>


<header>

<h1>
🇹🇷 Turkish Survival
</h1>

<p>
Istanbul Life Assistant
</p>

</header>




<main>



<section class="card">

<h2>
📅 今日任務
</h2>


<div id="dailyMission"></div>


<button onclick="dailyCheckIn()">

完成今日打卡

</button>


</section>





<section class="card">


<h2>
📚 30天生存課程
</h2>


<div id="dayMenu">

</div>


</section>






<section class="card">


<h2>
🔎 快速搜尋

</h2>


<input

id="searchInput"

placeholder="中文 / 土耳其文"


>


<button onclick="searchWord()">

搜尋

</button>


<div id="searchResult">

</div>


</section>







<section class="card">

<h2>
🤖 AI土耳其老師
</h2>


<input

id="aiInput"

placeholder="例如：我想買水"


>


<button onclick="askTeacher()">

詢問

</button>


<div id="aiAnswer">

</div>


</section>








<section class="card">


<h2>
🗣 情境對話

</h2>


<div id="dialogueArea">

</div>


<button onclick="nextDialogue()">

下一句

</button>


</section>






<section class="card">


<h2>
📝 A1測驗

</h2>


<div id="testArea">

</div>


<button onclick="startA1Test()">

開始測驗

</button>


</section>






<section class="card">


<h2>
⭐ 我的進度

</h2>


<div id="dashboard">

</div>


</section>



</main>





<footer>

Turkish Survival System v3.0

<br>

Made for Istanbul Life 🇹🇷

</footer>






<script src="js/turkish_database.js"></script>

<script src="js/dialogue_database.js"></script>

<script src="js/istanbul_database.js"></script>

<script src="js/product_database.js"></script>



<script src="js/app.js"></script>

<script src="js/progress.js"></script>

<script src="js/review.js"></script>

<script src="js/speaking.js"></script>

<script src="js/dialogue.js"></script>

<script src="js/a1_test.js"></script>

<script src="js/camera.js"></script>

<script src="js/ai_teacher.js"></script>

<script src="js/istanbul_life.js"></script>


</body>

</html>
